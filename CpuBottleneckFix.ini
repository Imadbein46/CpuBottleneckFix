; CpuBottleneckFix.ini - place next to CpuBottleneckFix.asi. Changes apply the next time the game starts.
; Comments must be on their own line (a ';' after a value is not allowed here).

[General]
; 0 = the plugin does nothing at all
Enabled=1
; 1 = write CpuBottleneckFix.log next to the .asi (what was hooked, what was tuned, a stats line every 5 s)
Log=0

[Hotkeys]
; Press while the game window has focus. Examples: CTRL+F9, ALT+SHIFT+X, F7, NONE (= disabled)
ToggleOverlay=CTRL+F9
ToggleCpuFix=CTRL+F10

[Overlay]
; show the FPS/latency overlay when the game starts
Show=1
; TopLeft, TopRight, BottomLeft, BottomRight
Corner=TopLeft
; how often the numbers update, milliseconds (100-5000)
RefreshMs=500
; 40 (very transparent) - 255 (solid)
Opacity=215
FontSize=11
ShowFps=1
; frame time in ms (time between two presented frames) and the worst frame of the last second
ShowLatency=1
ShowOnePercentLow=1
; time spent waiting inside the Present call (GPU / vsync)
ShowPresentWait=1
ShowCpuLoad=1
; name and module of the busiest thread, e.g.  "RenderThread" [game.exe]  kernel 12%
ShowBusiestThread=1
; "Limit: CPU / GPU or VSync" hint
ShowBottleneck=1
ShowCpuFixState=1

[CpuFix]
; start with the CPU fix switched on
Enabled=1
; ask Windows for a finer timer (better Sleep/wait accuracy, steadier frame pacing)
TimerResolution=1
; requested resolution in microseconds, 500 = 0.5 ms (the finest Windows allows), 1000 = 1 ms
TimerResolutionUs=500
; opt this game out of EcoQoS / power throttling (Windows 10 1709+ / Windows 11)
DisablePowerThrottling=1
; Unchanged, Normal, AboveNormal, High. Only ever raised, never lowered. Realtime is never used.
ProcessPriority=AboveNormal
; give the thread that presents frames and the main thread a slightly higher priority and their own core
ThreadTuning=1
; also give this many of the busiest BACKGROUND threads their own core (0-6). Their priority is never changed.
; 0 is recommended: background threads (shader compilers, streaming) are not what limits the frame rate.
TuneWorkerThreads=0
; priority for the presenting thread and the main thread (only if the game left them at normal): Unchanged, AboveNormal, Highest
HotThreadPriority=AboveNormal
; on CPUs with fast and slow cores (Intel 12th gen+) prefer the fast ones
PreferPerformanceCores=1
; keep tuned threads off core 0, which handles most system interrupts (only with 4+ physical cores)
AvoidCpu0=1
; register the presenting thread with the Windows multimedia scheduler ("Games" task)
UseMmcss=1
; how often threads are measured and (re)tuned, milliseconds (250-10000)
SampleMs=1000
